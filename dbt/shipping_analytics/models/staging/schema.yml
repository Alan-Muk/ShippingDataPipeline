version: 2

sources:
  - name: shipping
    description: "Raw warehouse tables loaded by the Python pipeline"
    schema: main
    tables:
      - name: customers
        description: "Synthetic EU customer records"
      - name: orders
        description: "Synthetic shipping orders"
      - name: warehouses
        description: "Static warehouse reference data (Amsterdam, Berlin, Paris, Madrid)"
      - name: routes
        description: "Computed shipping routes (distance, mode, duration)"
      - name: weather
        description: "Latest weather observation per warehouse"
      - name: delivery_risk
        description: "Computed delivery risk scores per route"