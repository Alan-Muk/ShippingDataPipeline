version: 2

models:

  - name: dim_customers
    description: "Customer dimension containing cleaned customer attributes"

    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null

      - name: first_name
        description: "Customer first name"

      - name: last_name
        description: "Customer last name"

      - name: email
        description: "Customer email address"

      - name: city
        description: "Customer city"

      - name: state
        description: "Customer state"

      - name: country
        description: "Customer country"
        tests:
          - not_null

      - name: latitude
        description: "Customer latitude"

      - name: longitude
        description: "Customer longitude"


  - name: fact_shipments
    description: "Central shipment fact table containing order and customer shipment details"

    columns:
      - name: order_id
        description: "Unique shipment order identifier"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: warehouse_id
        description: "Warehouse identifier"
        tests:
          - not_null

      - name: order_date
        description: "Order creation timestamp"
        tests:
          - not_null

      - name: status
        description: "Current shipment status"
        tests:
          - accepted_values:
              values: ['created', 'processing', 'shipped', 'delivered', 'cancelled']


  - name: delivery_performance
    description: "Dashboard-ready shipment performance model"

    columns:
      - name: order_id
        description: "Unique shipment order identifier"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null

      - name: warehouse_id
        description: "Warehouse identifier"
        tests:
          - not_null

      - name: order_date
        description: "Order creation timestamp"

      - name: status
        description: "Current shipment status"

      - name: package_weight_kg
        description: "Package weight in kilograms"

      - name: package_size
        description: "Package size category"

      - name: priority
        description: "Shipment priority level"

      - name: route_id
        description: "Unique route identifier (derived from order_id)"

      - name: distance_km
        description: "Route distance in kilometres (great-circle)"

      - name: estimated_delivery_hours
        description: "Estimated delivery duration in hours (mode-specific)"

      - name: transport_mode
        description: "Transport mode: van (<500km), truck (500–3000km), air (>3000km)"
        tests:
          - accepted_values:
              values: ['van', 'truck', 'air']

      - name: temperature
        description: "Warehouse temperature at pipeline run time (°C)"

      - name: wind_speed
        description: "Warehouse wind speed at pipeline run time (km/h)"

      - name: risk_score
        description: "Calculated delivery risk score (0–100)"
        tests:
          - not_null

      - name: risk_category
        description: "Risk classification derived from risk_score"
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']